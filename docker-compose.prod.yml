# Production-shaped stack (single host). Only the frontend/nginx port is published;
# Postgres, Redis and the API stay on the private compose network.
#
#   cp .env.example .env     # set JWT_SECRET_KEY, POSTGRES_PASSWORD, CORS_ORIGINS, ENV=production
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Put TLS in front (Caddy / an ALB / Cloudflare). Scale the API with:  --scale backend=3
# (Redis pub/sub keeps WebSockets consistent across instances; nginx round-robins them.)
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-converge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-converge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-converge}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: always
    env_file:
      - .env
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-converge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-converge}
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Set to false on extra replicas; run migrations once first (see docs/deployment.md).
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
